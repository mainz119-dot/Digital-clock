<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>시계 오버레이</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14181a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="시계오버레이">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root{
    --bg: #14181a;
    --panel: #1d2326;
    --panel-2: #242b2e;
    --line: #33393c;
    --text: #ece8e0;
    --text-dim: #96a0a3;
    --amber: #e8a33d;
    --teal: #5fa8a0;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header{
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1{
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header p{
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--text-dim);
  }
  .layout{
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 860px){
    .layout{ flex-direction: row; }
  }
  .stage-wrap{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 320px;
    background:
      radial-gradient(circle at 30% 20%, rgba(95,168,160,0.06), transparent 60%),
      var(--bg);
  }
  .stage{
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 16/10;
    background: #0f1213;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage.empty::before{
    content: "GIF 또는 동영상을 올려주세요";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 0 24px;
    z-index: 3;
    pointer-events: none;
  }
  .bg-media{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
  }
  canvas{
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  canvas.dragging{ cursor: grabbing; }
  
  body.fullscreen-mode canvas{
    cursor: default !important;
  }

  .panel{
    width: 100%;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 18px 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  @media (min-width: 860px){
    .panel{
      width: 340px;
      border-top: none;
      border-left: 1px solid var(--line);
      max-height: 100vh;
      overflow-y: auto;
    }
  }
  .group{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .group-label{
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .upload-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    background: var(--panel-2);
    border: 1px dashed var(--line);
    border-radius: 5px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .upload-btn:hover{ border-color: var(--teal); background: #263133; }
  input[type=file]{ display: none; }
  .filename{
    font-size: 12px;
    color: var(--text-dim);
    word-break: break-all;
  }
  .row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .row label{ font-size: 13px; color: var(--text); }
  .seg{
    display: flex;
    border: 1px solid var(--line);
    border-radius: 5px;
    overflow: hidden;
  }
  .seg button{
    flex: 1;
    padding: 7px 10px;
    background: var(--panel-2);
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .seg button.active{
    background: var(--teal);
    color: #0f1213;
    font-weight: 600;
  }
  .switch{
    position: relative;
    width: 38px;
    height: 22px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 20px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .switch .knob{
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: left .15s, background .15s;
  }
  .switch.on{ background: rgba(95,168,160,0.25); border-color: var(--teal); }
  .switch.on .knob{ left: 18px; background: var(--teal); }
  input[type=range]{
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--line);
    border-radius: 3px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--amber);
    border-radius: 50%;
    cursor: pointer;
  }
  .swatches{ display: flex; gap: 8px; }
  .swatch{
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .swatch.active{ border-color: var(--text); }
  .actions{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn{
    padding: 11px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn.primary{
    background: var(--amber);
    border-color: var(--amber);
    color: #1a1305;
    font-weight: 600;
  }
  .btn.recording{
    background: #c0503f;
    border-color: #c0503f;
    color: #fff;
  }
  .btn:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }
  .hint{
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .exit-fs-btn{
    display: none;
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 50;
    width: 3
