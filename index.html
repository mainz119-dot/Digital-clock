<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>시계 오버레이</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14181a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="시계오버레이">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #14181a;
    --panel: #1d2326;
    --panel-2: #242b2e;
    --line: #33393c;
    --text: #ece8e0;
    --text-dim: #96a0a3;
    --amber: #e8a33d;
    --teal: #5fa8a0;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header{
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1{
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header p{
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--text-dim);
  }
  .layout{
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 860px){
    .layout{ flex-direction: row; }
  }
  .stage-wrap{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 320px;
    background:
      radial-gradient(circle at 30% 20%, rgba(95,168,160,0.06), transparent 60%),
      var(--bg);
  }
  .stage{
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 16/10;
    background: #0f1213;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage.empty::before{
    content: "GIF 또는 동영상을 올려주세요";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 0 24px;
    z-index: 3;
    pointer-events: none;
  }
  /* 실제 GIF/동영상 요소 — 브라우저가 그대로 재생하게 둠 (애니메이션 문제 원천 해결) */
  .bg-media{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
    background: #0f1213;
  }
  /* 시계만 그리는 투명 캔버스 오버레이 */
  canvas{
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  canvas.dragging{ cursor: grabbing; }
  body.fullscreen-mode canvas{
    cursor: default;
  }
  .panel{
    width: 100%;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 18px 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  @media (min-width: 860px){
    .panel{
      width: 340px;
      border-top: none;
      border-left: 1px solid var(--line);
      max-height: 100vh;
      overflow-y: auto;
    }
  }
  .group{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .group-label{
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .upload-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    background: var(--panel-2);
    border: 1px dashed var(--line);
    border-radius: 5px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .upload-btn:hover{ border-color: var(--teal); background: #263133; }
  input[type=file]{ display: none; }
  .filename{
    font-size: 12px;
    color: var(--text-dim);
    word-break: break-all;
  }
  .row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .row label{ font-size: 13px; color: var(--text); }
  .seg{
    display: flex;
    border: 1px solid var(--line);
    border-radius: 5px;
    overflow: hidden;
  }
  .seg button{
    flex: 1;
    padding: 7px 10px;
    background: var(--panel-2);
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .seg button.active{
    background: var(--teal);
    color: #0f1213;
    font-weight: 600;
  }
  .switch{
    position: relative;
    width: 38px;
    height: 22px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 20px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .switch .knob{
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: left .15s, background .15s;
  }
  .switch.on{ background: rgba(95,168,160,0.25); border-color: var(--teal); }
  .switch.on .knob{ left: 18px; background: var(--teal); }
  input[type=range]{
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--line);
    border-radius: 3px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--amber);
    border-radius: 50%;
    cursor: pointer;
  }
  .swatches{ display: flex; gap: 8px; }
  .swatch{
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .swatch.active{ border-color: var(--text); }
  .actions{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn{
    padding: 11px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn.primary{
    background: var(--amber);
    border-color: var(--amber);
    color: #1a1305;
    font-weight: 600;
  }
  .btn.recording{
    background: #c0503f;
    border-color: #c0503f;
    color: #fff;
  }
  .btn:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }
  .hint{
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  /* ---- fullscreen viewing mode ---- */
  .exit-fs-btn{
    display: none;
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 50;
    width: 34px;
    height: 34px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(15,18,19,0.55);
    color: rgba(255,255,255,0.75);
    font-size: 16px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background .15s, color .15s;
  }
  .exit-fs-btn:hover{
    background: rgba(15,18,19,0.85);
    color: #fff;
  }
  body.fullscreen-mode header,
  body.fullscreen-mode .panel{
    display: none;
  }
  body.fullscreen-mode .exit-fs-btn{
    display: flex;
  }
  body.fullscreen-mode .stage-wrap{
    padding: 0;
    min-height: 100vh;
  }
  body.fullscreen-mode .stage{
    max-width: none;
    width: 100vw;
    height: 100vh;
    aspect-ratio: unset;
    border: none;
    border-radius: 0;
    box-shadow: none;
  }
</style>
</head>
<body>

<header>
  <h1>시계 오버레이</h1>
  <p>GIF나 동영상 위에 시계를 올려서 미리보고, 이미지나 영상으로 저장하세요.</p>
</header>

<div class="layout">
  <div class="stage-wrap">
    <div class="stage empty" id="stage">
      <canvas id="canvas" width="960" height="600"></canvas>
    </div>
  </div>

  <div class="panel">

    <div class="group">
      <div class="group-label">미디어</div>
      <label class="upload-btn" for="fileInput">파일 선택 (GIF · 이미지 · 동영상)</label>
      <input type="file" id="fileInput" accept="image/*,video/*">
      <div class="filename" id="filename">선택된 파일 없음</div>
    </div>

    <div class="group">
      <div class="group-label">시간 형식</div>
      <div class="seg" id="formatSeg">
        <button data-val="24" class="active">24시간</button>
        <button data-val="12">오전/오후</button>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <label>초 표시</label>
        <div class="switch on" id="secToggle"><div class="knob"></div></div>
      </div>
      <div class="row">
        <label>날짜 표시</label>
        <div class="switch" id="dateToggle"><div class="knob"></div></div>
      </div>
      <div class="row">
        <label>배경 라벨</label>
        <div class="switch on" id="bgToggle"><div class="knob"></div></div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">글자 크기</div>
      <input type="range" id="sizeRange" min="16" max="72" value="34">
    </div>

    <div class="group">
      <div class="group-label">색상</div>
      <div class="swatches" id="colorSwatches">
        <div class="swatch active" style="background:#e8a33d" data-color="#e8a33d"></div>
        <div class="swatch" style="background:#ffffff" data-color="#ffffff"></div>
        <div class="swatch" style="background:#5fa8a0" data-color="#5fa8a0"></div>
        <div class="swatch" style="background:#e85d5d" data-color="#e85d5d"></div>
        <div class="swatch" style="background:#8fd14f" data-color="#8fd14f"></div>
      </div>
    </div>

    <div class="hint">캔버스 위에서 시계를 드래그하면 위치를 옮길 수 있어요. (전체화면 모드에서는 위치가 고정돼요)</div>

    <div class="group">
      <div class="group-label">내보내기</div>
      <div class="actions">
        <button class="btn primary" id="snapshotBtn" disabled>현재 화면 PNG로 저장</button>
        <button class="btn" id="recordBtn" disabled>동영상으로 녹화 (WebM)</button>
      </div>
      <div class="hint" id="recordHint">녹화는 원본이 동영상이거나 재생 중인 GIF일 때 특히 유용해요. 녹화 중 다시 누르면 멈추고 자동 저장됩니다.</div>
    </div>

    <div class="group">
      <div class="group-label">화면</div>
      <button class="btn" id="fullscreenBtn" disabled>전체화면으로 보기</button>
      <div class="hint">설정창과 브라우저 화면을 숨기고 이미지와 시계만 보여줘요. 우측 상단 ✕ 버튼이나 Esc 키로 돌아올 수 있어요.</div>
    </div>

  </div>
</div>

<button class="exit-fs-btn" id="exitFsBtn" title="설정으로 돌아가기">✕</button>

<script>
(function(){
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const fileInput = document.getElementById('fileInput');
  const filenameEl = document.getElementById('filename');
  const snapshotBtn = document.getElementById('snapshotBtn');
  const recordBtn = document.getElementById('recordBtn');
  const recordHint = document.getElementById('recordHint');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const exitFsBtn = document.getElementById('exitFsBtn');

  let bgMediaEl = null;      // the actual visible <img> or <video> playing the GIF/video
  let mediaType = null;      // 'image' | 'video'
  let rafId = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let recordRafId = null;

  const clock = {
    format: 24,
    showSeconds: true,
    showDate: false,
    showBg: true,
    size: 34,
    color: '#e8a33d',
    // position as fraction (0..1) of the stage box
    x: 0.5,
    y: 0.88
  };

  // ---------- controls wiring ----------
  document.getElementById('formatSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    [...e.currentTarget.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    clock.format = parseInt(btn.dataset.val, 10);
  });

  function wireSwitch(id, key){
    const el = document.getElementById(id);
    el.addEventListener('click', () => {
      el.classList.toggle('on');
      clock[key] = el.classList.contains('on');
    });
  }
  wireSwitch('secToggle', 'showSeconds');
  wireSwitch('dateToggle', 'showDate');
  wireSwitch('bgToggle', 'showBg');

  document.getElementById('sizeRange').addEventListener('input', (e) => {
    clock.size = parseInt(e.target.value, 10);
  });

  document.getElementById('colorSwatches').addEventListener('click', (e) => {
    const sw = e.target.closest('.swatch');
    if(!sw) return;
    [...e.currentTarget.children].forEach(c => c.classList.remove('active'));
    sw.classList.add('active');
    clock.color = sw.dataset.color;
  });

  // ---------- file loading ----------
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    filenameEl.textContent = file.name;
    loadMedia(file);
  });

  function loadMedia(file){
    stopEverything();
    if(bgMediaEl){
      bgMediaEl.remove();
      bgMediaEl = null;
    }
    const url = URL.createObjectURL(file);
    const isVideo = file.type.startsWith('video/');

    if(isVideo){
      mediaType = 'video';
      const video = document.createElement('video');
      video.className = 'bg-media';
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      video.autoplay = true;
      video.addEventListener('loadedmetadata', () => {
        video.play();
        stage.classList.remove('empty');
        enableExport();
      });
      stage.insertBefore(video, canvas);
      video.src = url;
      bgMediaEl = video;
    } else {
      // GIF/이미지: 실제 <img> 태그를 화면에 그대로 깔아서 브라우저가 애니메이션을
      // 직접 재생하게 둡니다 (캔버스로 매 프레임 그려 넣는 방식은 일부 모바일
      // 브라우저에서 프레임이 갱신되지 않는 문제가 있었음).
      mediaType = 'image';
      const img = document.createElement('img');
      img.className = 'bg-media';
      img.alt = '';
      img.addEventListener('load', () => {
        stage.classList.remove('empty');
        enableExport();
      });
      stage.insertBefore(img, canvas);
      img.src = url;
      bgMediaEl = img;
    }
  }

  function getMediaNaturalSize(){
    if(!bgMediaEl) return null;
    if(mediaType === 'video'){
      return { w: bgMediaEl.videoWidth || 1280, h: bgMediaEl.videoHeight || 720 };
    }
    return { w: bgMediaEl.naturalWidth || 1280, h: bgMediaEl.naturalHeight || 720 };
  }

  function enableExport(){
    snapshotBtn.disabled = false;
    recordBtn.disabled = false;
    fullscreenBtn.disabled = false;
  }

  // ---------- overlay canvas: draws ONLY the clock ----------
  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(rect.width * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    if(canvas.width !== w) canvas.width = w;
    if(canvas.height !== h) canvas.height = h;
  }

  function startLoop(){
    if(rafId) cancelAnimationFrame(rafId);
    function frame(){
      resizeCanvas();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawClock(ctx, canvas.width, canvas.height, clock);
      rafId = requestAnimationFrame(frame);
    }
    frame();
  }
  startLoop(); // clock overlay runs continuously regardless of media state

  function stopEverything(){
    if(bgMediaEl && mediaType === 'video'){
      bgMediaEl.pause();
    }
    if(isRecording) stopRecording();
  }

  function pad(n){ return n.toString().padStart(2,'0'); }

  function formatTimeString(fmt, showSeconds){
    const now = new Date();
    let h = now.getHours();
    let period = '';
    if(fmt === 12){
      period = h >= 12 ? ' 오후' : ' 오전';
      h = h % 12;
      if(h === 0) h = 12;
    }
    const m = pad(now.getMinutes());
    let str = `${fmt === 12 ? h : pad(h)}:${m}`;
    if(showSeconds) str += `:${pad(now.getSeconds())}`;
    if(fmt === 12) str += period;
    return str;
  }

  function formatDateString(){
    const now = new Date();
    const days = ['일','월','화','수','목','금','토'];
    return `${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
  }

  // reusable: draws the clock onto any ctx/size/state (used for live overlay AND export)
  function drawClock(targetCtx, w, h, state){
    const timeStr = formatTimeString(state.format, state.showSeconds);
    const dateStr = state.showDate ? formatDateString() : null;

    const fontSize = state.size * (w / 640); // scale relative to a 640px reference width
    targetCtx.font = `600 ${fontSize}px 'Share Tech Mono', monospace`;
    targetCtx.textAlign = 'center';
    targetCtx.textBaseline = 'middle';

    const cx = state.x * w;
    const cy = state.y * h;

    const timeWidth = targetCtx.measureText(timeStr).width;
    let dateWidth = 0;
    const dateFontSize = fontSize * 0.42;
    if(dateStr){
      targetCtx.font = `500 ${dateFontSize}px 'Space Grotesk', sans-serif`;
      dateWidth = targetCtx.measureText(dateStr).width;
    }
    const blockWidth = Math.max(timeWidth, dateWidth);
    const padX = fontSize * 0.45;
    const padY = fontSize * 0.35;
    const totalHeight = fontSize + (dateStr ? dateFontSize + fontSize*0.25 : 0);

    if(state.showBg){
      const boxW = blockWidth + padX*2;
      const boxH = totalHeight + padY*2;
      const boxX = cx - boxW/2;
      const boxY = cy - boxH/2;
      const r = Math.min(10, boxH/4);
      targetCtx.fillStyle = 'rgba(10,12,13,0.55)';
      roundRect(targetCtx, boxX, boxY, boxW, boxH, r);
      targetCtx.fill();
    }

    targetCtx.fillStyle = state.color;
    targetCtx.shadowColor = 'rgba(0,0,0,0.6)';
    targetCtx.shadowBlur = fontSize * 0.15;

    if(dateStr){
      targetCtx.font = `600 ${fontSize}px 'Share Tech Mono', monospace`;
      targetCtx.textBaseline = 'alphabetic';
      targetCtx.fillText(timeStr, cx, cy - dateFontSize*0.3);
      targetCtx.font = `500 ${dateFontSize}px 'Space Grotesk', sans-serif`;
      targetCtx.fillStyle = 'rgba(255,255,255,0.85)';
      targetCtx.fillText(dateStr, cx, cy + fontSize*0.55);
    } else {
      targetCtx.textBaseline = 'middle';
      targetCtx.fillText(timeStr, cx, cy);
    }
    targetCtx.shadowBlur = 0;
  }

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function clamp01(v){ return Math.min(1, Math.max(0, v)); }

  // maps stage-fraction clock position to a fraction relative to the actual
  // rendered media rect (object-fit: contain may letterbox within the stage box)
  function stageFractionToMediaFraction(stageW, stageH, mediaW, mediaH){
    const scale = Math.min(stageW / mediaW, stageH / mediaH);
    const rectW = mediaW * scale, rectH = mediaH * scale;
    const rectX = (stageW - rectW) / 2, rectY = (stageH - rectH) / 2;
    const pxX = clock.x * stageW, pxY = clock.y * stageH;
    return {
      x: clamp01((pxX - rectX) / rectW),
      y: clamp01((pxY - rectY) / rectH)
    };
  }

  // ---------- drag to reposition (locked while in fullscreen viewing mode) ----------
  let dragging = false;
  function toCanvasCoords(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) / rect.width;
    const y = (clientY - rect.top) / rect.height;
    return {x: clamp01(x), y: clamp01(y)};
  }
  canvas.addEventListener('pointerdown', (e) => {
    if(document.body.classList.contains('fullscreen-mode')) return; // locked in fullscreen
    if(!bgMediaEl) return;
    dragging = true;
    canvas.classList.add('dragging');
    const p = toCanvasCoords(e.clientX, e.clientY);
    clock.x = p.x; clock.y = p.y;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const p = toCanvasCoords(e.clientX, e.clientY);
    clock.x = p.x; clock.y = p.y;
  });
  ['pointerup','pointercancel'].forEach(ev => {
    canvas.addEventListener(ev, () => {
      dragging = false;
      canvas.classList.remove('dragging');
    });
  });

  // ---------- export: snapshot (PNG) ----------
  snapshotBtn.addEventListener('click', () => {
    if(!bgMediaEl) return;
    const size = getMediaNaturalSize();
    const stageRect = stage.getBoundingClientRect();
    const frac = stageFractionToMediaFraction(stageRect.width, stageRect.height, size.w, size.h);

    const off = document.createElement('canvas');
    off.width = size.w;
    off.height = size.h;
    const offCtx = off.getContext('2d');
    offCtx.drawImage(bgMediaEl, 0, 0, size.w, size.h);
    drawClock(offCtx, size.w, size.h, { ...clock, x: frac.x, y: frac.y });

    const link = document.createElement('a');
    link.download = 'clock-overlay.png';
    link.href = off.toDataURL('image/png');
    link.click();
  });

  // ---------- export: record (WebM) ----------
  recordBtn.addEventListener('click', () => {
    if(isRecording){
      stopRecording();
    } else {
      startRecording();
    }
  });

  function startRecording(){
    if(!bgMediaEl) return;
    if(!HTMLCanvasElement.prototype.captureStream){
      alert('이 브라우저는 캔버스 녹화를 지원하지 않습니다.');
      return;
    }
    const size = getMediaNaturalSize();
    const off = document.createElement('canvas');
    off.width = size.w;
    off.height = size.h;
    const offCtx = off.getContext('2d');

    function recordFrame(){
      const stageRect = stage.getBoundingClientRect();
      const frac = stageFractionToMediaFraction(stageRect.width, stageRect.height, size.w, size.h);
      offCtx.clearRect(0, 0, size.w, size.h);
      offCtx.drawImage(bgMediaEl, 0, 0, size.w, size.h);
      drawClock(offCtx, size.w, size.h, { ...clock, x: frac.x, y: frac.y });
      if(isRecording){
        recordRafId = requestAnimationFrame(recordFrame);
      }
    }

    recordedChunks = [];
    const stream = off.captureStream(30);
    let options = { mimeType: 'video/webm;codecs=vp9' };
    if(!MediaRecorder.isTypeSupported(options.mimeType)){
      options = { mimeType: 'video/webm' };
    }
    try{
      mediaRecorder = new MediaRecorder(stream, options);
    }catch(err){
      alert('녹화를 시작할 수 없습니다: ' + err.message);
      return;
    }
    mediaRecorder.ondataavailable = (e) => {
      if(e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = 'clock-overlay.webm';
      link.href = url;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    };

    isRecording = true;
    mediaRecorder.start();
    recordFrame();

    recordBtn.textContent = '녹화 중지 (누르면 저장)';
    recordBtn.classList.add('recording');
    recordHint.textContent = '녹화가 진행 중입니다. 다시 누르면 멈추고 파일이 자동으로 저장됩니다.';
  }

  function stopRecording(){
    isRecording = false;
    if(recordRafId){ cancelAnimationFrame(recordRafId); recordRafId = null; }
    if(mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.stop();
    }
    recordBtn.textContent = '동영상으로 녹화 (WebM)';
    recordBtn.classList.remove('recording');
    recordHint.textContent = '녹화는 원본이 동영상이거나 재생 중인 GIF일 때 특히 유용해요. 녹화 중 다시 누르면 멈추고 자동 저장됩니다.';
  }

  // ---------- distraction-free fullscreen mode ----------
  function enterFullscreenMode(){
    document.body.classList.add('fullscreen-mode');
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(req) req.call(el).catch(() => {});
  }

  function exitFullscreenMode(){
    document.body.classList.remove('fullscreen-mode');
    if(document.fullscreenElement || document.webkitFullscreenElement){
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document).catch(() => {});
    }
  }

  fullscreenBtn.addEventListener('click', enterFullscreenMode);
  exitFsBtn.addEventListener('click', exitFullscreenMode);

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && document.body.classList.contains('fullscreen-mode')){
      exitFullscreenMode();
    }
  });

  ['fullscreenchange','webkitfullscreenchange'].forEach(ev => {
    document.addEventListener(ev, () => {
      if(!document.fullscreenElement && !document.webkitFullscreenElement){
        document.body.classList.remove('fullscreen-mode');
      }
    });
  });

  window.addEventListener('resize', resizeCanvas);

  // ---------- PWA: register service worker ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }

})();
</script>
</body>
</html>
